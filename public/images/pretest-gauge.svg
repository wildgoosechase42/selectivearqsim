    <text x="70" y="32" fill="rgba(245,245,245,0.5)" font-family="monospace" font-size="10" text-anchor="middle">FEEDBACK</text>
    <text x="70" y="55" fill="#22c55e" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">INSTANT</text>
