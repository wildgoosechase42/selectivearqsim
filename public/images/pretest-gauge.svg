<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pretestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241a12"/>
      <stop offset="100%" stop-color="#120c08"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#pretestBg)"/>
  <g transform="translate(300, 210)">
    <path d="M -140 0 A 140 140 0 0 1 140 0" fill="none" stroke="#292929" stroke-width="16" stroke-linecap="round"/>
    <path d="M -140 0 A 140 140 0 0 1 60 -126" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="14" fill="#d4af35"/>
    <line x1="0" y1="0" x2="45" y2="-95" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="45" cy="-95" r="4" fill="#ffffff"/>
    <text x="0" y="-30" fill="#f5f5f5" font-family="monospace" font-size="28" font-weight="bold" text-anchor="middle">PRETEST</text>
    <text x="0" y="5" fill="#d4af35" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">BASELINE DIAGNOSTIC</text>
  </g>
  <g transform="translate(60, 270)">
    <rect width="140" height="70" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="70" y="32" fill="rgba(245,245,245,0.5)" font-family="monospace" font-size="10" text-anchor="middle">QUESTION COUNT</text>
    <text x="70" y="55" fill="#f5f5f5" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">05 ITEMS</text>
  </g>
