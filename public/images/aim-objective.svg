<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aimBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="aimCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c81e1e"/>
      <stop offset="100%" stop-color="#801010"/>
    </linearGradient>
    <filter id="aimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#aimBg)"/>
  <circle cx="300" cy="200" r="130" fill="none" stroke="rgba(200,30,30,0.15)" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="300" cy="200" r="95" fill="none" stroke="rgba(212,175,53,0.2)" stroke-width="1.5"/>
  <circle cx="300" cy="200" r="60" fill="rgba(200,30,30,0.12)" stroke="rgba(200,30,30,0.5)" stroke-width="2"/>
  <circle cx="300" cy="200" r="20" fill="url(#aimCrimson)" filter="url(#aimGlow)"/>
  <circle cx="300" cy="200" r="8" fill="#ffffff"/>
  <line x1="120" y1="200" x2="260" y2="200" stroke="rgba(200,30,30,0.4)" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="340" y1="200" x2="480" y2="200" stroke="rgba(200,30,30,0.4)" stroke-width="2" stroke-dasharray="3 3"/>
  <line x1="300" y1="50" x2="300" y2="160" stroke="rgba(212,175,53,0.3)" stroke-width="1.5"/>
  <line x1="300" y1="240" x2="300" y2="350" stroke="rgba(212,175,53,0.3)" stroke-width="1.5"/>
  <g transform="translate(100, 175)">
    <rect width="50" height="50" rx="8" fill="#1c1c1c" stroke="#c81e1e" stroke-width="2"/>
    <text x="25" y="31" fill="#f5f5f5" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">TX</text>
  </g>
  <g transform="translate(450, 175)">
    <rect width="50" height="50" rx="8" fill="#1c1c1c" stroke="#d4af35" stroke-width="2"/>
    <text x="25" y="31" fill="#f5f5f5" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">RX</text>
  </g>
  <text x="300" y="325" fill="#f5f5f5" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="2" text-anchor="middle">OBJECTIVE : SELECTIVE ARQ</text>
  <text x="300" y="345" fill="rgba(245,245,245,0.6)" font-family="monospace" font-size="11" text-anchor="middle">SLIDING WINDOW PROTOCOL</text>
